services:
  ctfd:
    image: ${CTFD_IMAGE:?CTFD_IMAGE must be set to an ECR digest}
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    depends_on:
      permissions:
        condition: service_completed_successfully
      sql-judge:
        condition: service_healthy
    networks:
      - default
      - internal

  permissions:
    image: alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable@sha256:09cc2702709e6388d979d8030e3ab4eb1ceb699b2dced26d7543e872a822e823
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - ctfd

  mysql-judge:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    env_file:
      - .env.judge
    environment:
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --disable-log-bin
      - --event-scheduler=DISABLED
      - --lower-case-table-names=1
      - --innodb-buffer-pool-size=128M
      - --innodb-flush-log-at-trx-commit=2
      - --max-allowed-packet=16M
      - --max-connections=64
      - --performance-schema=OFF
      - --skip-name-resolve
    mem_limit: 768m
    volumes:
      - mysql-judge-data:/var/lib/mysql
    networks:
      - judge-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  sql-judge:
    image: ${SQL_JUDGE_IMAGE:?SQL_JUDGE_IMAGE must be set to an ECR digest}
    restart: always
    env_file:
      - .env.judge
    environment:
      LOG_FOLDER: /var/log/CTFd
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
    networks:
      - internal
      - judge-db
    depends_on:
      mysql-judge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
  default:
  internal:
    internal: true
  judge-db:
    internal: true

volumes:
  mysql-judge-data:
