services:
  ctfd:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      sql-judge:
        condition: service_healthy
    networks:
        default:
        internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  # db:
  #   image: mariadb:10.11
  #   restart: always
  #   environment:
  #     - MARIADB_ROOT_PASSWORD=ctfd
  #     - MARIADB_USER=ctfd
  #     - MARIADB_PASSWORD=ctfd
  #     - MARIADB_DATABASE=ctfd
  #     - MARIADB_AUTO_UPGRADE=1
  #   volumes:
  #     - .data/mysql:/var/lib/mysql
  #   networks:
  #       internal:
  #   # This command is required to set important mariadb defaults
  #   command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  # cache:
  #   image: redis:4
  #   restart: always
  #   volumes:
  #   - .data/redis:/data
  #   networks:
  #       internal:

  mysql-judge:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    env_file:
      - .env.judge
    environment:
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --disable-log-bin
      - --event-scheduler=DISABLED
      - --innodb-buffer-pool-size=128M
      - --innodb-flush-log-at-trx-commit=2
      - --max-allowed-packet=16M
      - --max-connections=64
      - --performance-schema=OFF
      - --skip-name-resolve
    mem_limit: 768m
    volumes:
      - mysql-judge-data:/var/lib/mysql
    networks:
      - judge-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  sql-judge:
    build: ./CTFd/plugins/sql_challenges
    restart: always
    networks:
      - internal
      - judge-db
    env_file:
      - .env.judge
    environment:
      LOG_FOLDER: /var/log/CTFd
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
    depends_on:
      mysql-judge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
    default:
    internal:
        internal: true
    judge-db:
        internal: true

volumes:
    mysql-judge-data:
