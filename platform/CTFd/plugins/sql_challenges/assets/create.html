<form
  method="POST"
  action="{{ script_root }}/api/v1/challenges"
  enctype="multipart/form-data"
>
  <div class="form-group">
    <label for="name"
      >Name<br />
      <small class="form-text text-muted"> The name of your challenge </small>
    </label>
    <input
      type="text"
      class="form-control"
      name="name"
      placeholder="Enter challenge name"
    />
  </div>
  <div class="form-group">
    <label for="category"
      >Category<br />
      <small class="form-text text-muted">
        The category of your challenge
      </small>
    </label>
    <input
      type="text"
      class="form-control"
      name="category"
      placeholder="Enter challenge category"
    />
  </div>
  <div class="form-group">
    <label for="value"
      >Points<br />
      <small class="form-text text-muted">
        The amount of points awarded for solving this challenge
      </small>
    </label>
    <input
      type="number"
      class="form-control"
      name="value"
      placeholder="Enter value"
      required
    />
  </div>
  <div class="form-group">
    <label for="description"
      >Description<br />
      <small class="form-text text-muted">
        Use this to give a brief description of your challenge. The description
        supports HTML and Markdown.
      </small>
    </label>
    <textarea
      id="new-desc-editor"
      class="form-control"
      name="description"
      rows="10"
    ></textarea>
  </div>

  <!-- SQL Challenge Specific Fields -->
    <div class="alert alert-info" role="alert">
      문제를 만들기 전에 <a href="https://github.com/ddps-lab/sql-playzone/blob/dev/platform/CTFd/plugins/sql_challenges/AUTHORING.md" target="_blank" rel="noopener">SQL 문제 출제 가이드</a>를 읽어 주세요. init은 로컬 스크립트를 그대로 붙여도 되지만, 정렬·표시 형식 설정은 문제 설명과 일치해야 하며 학생에게도 공개됩니다.
    </div>
  <div class="form-group">
    <label for="init_query"
      >Initialization Query<br />
      <small class="form-text text-muted">
        SQL queries to initialize the database (CREATE TABLE, INSERT data,
        etc.). Separate multiple statements with semicolons.
      </small>
    </label>
    <textarea
      class="form-control"
      name="init_query"
      rows="10"
      placeholder="CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users VALUES (1, 'Alice', 25);
INSERT INTO users VALUES (2, 'Bob', 30);"
    ></textarea>
  </div>

  <div class="form-group">
    <label for="solution_query"
      >Solution Query<br />
      <small class="form-text text-muted">
        The correct SQL query that produces the expected result.
      </small>
    </label>
    <textarea
      class="form-control"
      name="solution_query"
      rows="5"
      placeholder="SELECT * FROM users WHERE age > 25;"
    ></textarea>
  </div>


 <div class="form-group"><label>정렬 기준 (결과의 열 번호, 1부터)</label>
 <input class="form-control" name="grading_order" value="" placeholder="예: 1 asc, 2 desc">
 <small>비워 두면 행 순서를 평가하지 않습니다. 같은 정렬 값을 가진 행끼리는 순서가 자유롭습니다. 문제 설명과 일치시켜 주세요.</small></div>
 <div class="form-group"><label>표시 형식까지 평가하는 열 번호</label>
 <input class="form-control" name="grading_format" value="" placeholder="예: 3, 4">
 <small>소수 자릿수 등 표시 요구를 문제에 명시한 열만 입력하세요. 나머지 숫자는 정확한 값으로 비교합니다(1 = 1.00).</small></div>
 <!-- Test Section -->
  <div class="form-group">
    <label
      >Test Your Queries<br />
      <small class="form-text text-muted">
        Test your initialization and solution queries before saving.
      </small>
    </label>
    <button type="button" class="btn btn-primary" id="test-sql-btn">
      Test SQL Queries
    </button>
    <div id="test-results" class="mt-3" style="display: none">
      <h5>Test Results:</h5>
      <div id="test-output" class="border p-3 bg-body-secondary"></div>
    </div>
  </div>

  <div class="form-group">
    <label for="deadline"
      >Deadline (KST)<br />
      <small class="form-text text-muted">
        The submission deadline for this challenge in Korean Standard Time
        (optional)
      </small>
    </label>
    <input
      type="datetime-local"
      class="form-control"
      name="deadline"
      placeholder="Select deadline"
    />
  </div>

  <div class="form-group">
    <label for="state"
      >State<br />
      <small class="form-text text-muted">
        The state of the challenge (visible, hidden)
      </small>
    </label>
    <select class="form-control" name="state">
      <option value="visible">Visible</option>
      <option value="hidden">Hidden</option>
    </select>
  </div>

  <div class="form-group">
    <label for="max_attempts"
      >Max Attempts<br />
      <small class="form-text text-muted">
        Maximum amount of attempts users receive. Leave at 0 for unlimited.
      </small>
    </label>
    <input
      type="number"
      class="form-control"
      name="max_attempts"
      placeholder="0"
      value="0"
    />
  </div>

  <input type="hidden" name="type" value="sql" />

  <div class="form-group">
    <button
      type="submit"
      id="submit"
      tabindex="5"
      class="btn btn-primary float-md-right"
    >
      Create
    </button>
  </div>
</form>
